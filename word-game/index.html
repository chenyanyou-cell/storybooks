function fresh(){return {stars:0,level:1,unlocked:[],equipped:null,questionsAnswered:0,modes:{},days:{}}}for(const p of names){ledger[p] ||= {};all[p]={...fresh(),...all[p]};all[p].level=1+Math.floor(all[p].stars/10)}save();
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayNumber(s){const [y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000)}
function status(attempts=[],date=today()){
 const a=attempts.filter(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.firstTryCorrect==='boolean');
 const cant=a.slice(-3).filter(x=>!x.firstTryCorrect).length>=2,learned=new Set(a.filter(x=>x.firstTryCorrect).map(x=>x.date)).size>=3;
 const dates=new Set();for(let i=a.length-1;i>=0;i--){if(!a[i].firstTryCorrect)break;dates.add(a[i].date)}
 const step=dates.size,interval=[1,3,7,14][Math.min(Math.max(step-1,0),3)],due=a.length>0&&(cant||!a.at(-1).firstTryCorrect||dayNumber(date)-dayNumber(a.at(-1).date)>=interval);
 return {cant,learned,due,step,interval,label:cant?'記不住':learned?'學會了':due?'該複習':'練習中'};
}
function attempts(p,w){return Array.isArray(ledger[p]?.[w])?ledger[p][w]:[]}
function ranked(p,excluded=new Set()){return D.words.filter(w=>!excluded.has(w.word)).map((w,i)=>({w,i,s:status(attempts(p,w.word))})).sort((a,b)=>(a.s.cant?0:a.s.due?1:a.w.episode_date===D.date?2:3)-(b.s.cant?0:b.s.due?1:b.w.episode_date===D.date?2:3)||a.i-b.i).map(x=>x.w)}
function select(p,excluded=new Set()){return ranked(p,new Set(excluded)).slice(0,3)}
// Session-only rotation: never changes the persisted ledger/progress format.
const rotations=new Map();
function pickWord(p,excluded=new Set()){
 const omit=new Set(excluded);let session=rotations.get(p);
 if(!session){session={recent:[],seen:new Set(),counts:new Map()};rotations.set(p,session)}
 const pool=D.words.filter(w=>!omit.has(w.word));if(!pool.length)return null;
 let recent=session.recent.slice(-12),eligible=pool.filter(w=>!recent.includes(w.word));
 // Only relax oldest exclusions when the available pool is too small.
 while(!eligible.length&&recent.length){recent.shift();eligible=pool.filter(w=>!recent.includes(w.word))}
 const date=today(),weights=eligible.map(w=>{
  const a=attempts(p,w.word),s=status(a,date);
  let weight=s.cant?6:s.due?3:w.episode_date===D.date?1.5:1;
  if(a.some(x=>x.date===date&&x.firstTryCorrect))weight*=0.2;
  if(!session.seen.has(w.word)&&!a.length)weight*=8;
  return weight/(1+(session.counts.get(w.word)||0));
 });
 let roll=Math.random()*weights.reduce((sum,w)=>sum+w,0),index=0;
 while(index<weights.length-1&&roll>=weights[index])roll-=weights[index++];
 const word=eligible[index];session.recent.push(word.word);session.recent=session.recent.slice(-12);
 session.seen.add(word.word);session.counts.set(word.word,(session.counts.get(word.word)||0)+1);
 return word;
}
let player=null,mode='players',current=null,roundIndex=0,missed=false,locked=false,token=0,audio=null,cancelWait=null,ctx;
const P=()=>all[player],shuffle=a=>a.map(x=>({x,n:Math.random()})).sort((a,b)=>a.n-b.n).map(x=>x.x),delay=ms=>new Promise(r=>setTimeout(r,ms));
function silence(){token++;cancelWait?.();try{audio?.pause();window.speechSynthesis?.cancel()}catch{}}
function speak(text,lang='zh-TW',src=null){speechLog.push({kind:src?'mp3':'speech',text,lang,src});events.push({type:'speech',text,src});const bubble=document.querySelector('#speech');if(bubble)bubble.textContent=text;
 return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);if(cancelWait===finish)cancelWait=null;resolve()};const timer=setTimeout(()=>{try{audio?.pause();window.speechSynthesis?.cancel()}catch{}finish()},src?5000:2500);cancelWait=finish;
 try{if(src){const a=audio=new Audio(src);a.onended=a.onerror=finish;a.play()?.catch(finish)}else{const ss=window.speechSynthesis,v=ss?.getVoices().find(v=>v.localService&&v.lang.toLowerCase().startsWith(lang.slice(0,2)));if(!v){finish();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.voice=v;u.onend=u.onerror=finish;ss.speak(u)}}catch{finish()}})}
function effect(type){events.push({type:'fx',fx:type});try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ctx ||= new C();ctx.resume().catch(()=>{});const celebratory=['levelup','unlock','applause','match'].includes(type);for(let i=0;i<(celebratory?5:1);i++){const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.09;o.type='triangle';o.frequency.value=440+i*110;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.2)}}catch{}}
function header(){const p=player?P():null;document.querySelector('#identity').innerHTML=p?`<img alt="${player}" src="assets/avatars/${player.toLowerCase()}.jpg"><div>${player} · Lv${p.level}<strong id="stars"> ⭐ ${p.stars}</strong><small>再 ${10-p.stars%10} 星升級</small><div class="meter"><i style="width:${p.stars%10*10}%"></i></div></div>`:'🪐 星星探險隊';document.querySelector('#corner').textContent=p&&p.equipped!==null?rewards[p.equipped]?.[0]||'🚀':'🚀';document.body.style.background=p?.equipped===10?'#362052':'#101b43';if(p?.equipped===8||p?.equipped===11){const img=document.querySelector('header img');img.style.borderColor=p.equipped===8?'#b4dfff':'#ffcc43'}}
function view(html,scroll=false){main.className=scroll?'scroll':'';main.innerHTML=html+'<div id="speech" aria-live="polite"></div>';header();main.querySelectorAll('button').forEach(b=>{if(!b.hasAttribute('data-testid'))b.setAttribute('data-testid',b.dataset.card?'card-'+b.dataset.card:b.dataset.letter?'letter-'+b.dataset.index:b.dataset.reward?'reward-'+b.dataset.reward:b.id||'action');if(!b.hasAttribute('aria-label'))b.setAttribute('aria-label',b.textContent.trim())})}
function reset(){silence();document.querySelector('.toast')?.remove();locked=false;current=null}
function players(){reset();mode='players';player=null;view('<p class="sub">WORD GALAXY · 一起探索單字宇宙</p><h1>今天誰要出發？</h1><p>小機器人正在等你喔！ 🤖</p><div class="players">'+names.map(p=>`<button data-testid="player-${p}" data-player="${p}"><img alt="" src="assets/avatars/${p.toLowerCase()}.jpg">${p}<br>⭐ ${all[p].stars}</button>`).join('')+'</div>');main.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{player=b.dataset.player;home();speak(player,'en-US',`assets/audio/_${player.toLowerCase()}.mp3`)})}
const modes=[['listen','🎧','聽音點圖','Listen & Find'],['pick','🔎','看圖選字','Picture Words'],['memory','🃏','記憶配對','Memory Match'],['spell','🔤','拼拼看','Spell It'],['repeat','🗣️','跟我說','Say It With Me'],['progress','🏆','我的進度','My Adventure']];
function home(){if(!player)return players();reset();mode='menu';view('<p class="sub">✦ 你的每一次嘗試，都會讓宇宙更亮 ✦</p><h1>選一個星球，開始冒險！</h1><div class="grid">'+modes.map(([id,icon,zh,en])=>`<button class="mode" data-testid="mode-${id}" data-mode="${id}"><span class="icon">${icon}</span>${zh}<small>${en}</small></button>`).join('')+'</div><button data-testid="mode-collection" id="cabinet">🎁 星星收藏櫃</button>');main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const id=b.dataset.mode;reset();mode=id;if(id==='progress')progressPage();else{P().modes[id]=(P().modes[id]||0)+1;save();next()}speak(modes.find(x=>x[0]===id)[2])});document.querySelector('#cabinet').onclick=collection}
function target(){return pickWord(player)}
function replayButton(){return '<button data-testid="btn-replay" id="replay" aria-label="再聽一次">🔊 再聽一次</button>'}
function ask(){if(locked)return;silence();if(!current)return;const w=D.words.find(w=>w.word===current.word);speak(w.word,'en-US',w.audio)}
function next(){reset();roundIndex++;missed=false;const w=target();current={word:w.word,target:w.word};events.push({type:'question',player,mode,word:w.word,roundIndex});if(mode==='memory')return memory(w);if(mode==='spell')return spell(w);if(mode==='repeat')return repeat(w);const pool=shuffle(D.words.filter(x=>x.word!==w.word));if(P().level<=2)pool.sort((a,b)=>Number(w.confusable.includes(a.word)||a.confusable.includes(w.word)||a.kind===w.kind)-Number(w.confusable.includes(b.word)||b.confusable.includes(w.word)||b.kind===w.kind));if(P().level>2)pool.sort((a,b)=>Number(w.confusable.includes(b.word))-Number(w.confusable.includes(a.word)));const opts=shuffle([w,...pool.slice(0,2)]);current.options=opts.map(x=>x.word);view(`<p class="sub">${mode==='listen'?'🎧 聽一聽，找圖片':'🔎 看圖選字'} · 第 ${roundIndex} 次探索</p><h1>${mode==='listen'?'哪張圖是你聽到的單字？':`哪一個是 ${w.word}？`}</h1><div class="cards">${opts.map(x=>`<button class="card" data-word="${x.word}" aria-label="選擇圖片"><img alt="" src="${x.image}">${mode==='pick'?`<strong>${x.word}</strong><span>${x.zh}</span>`:''}</button>`).join('')}</div><p id="feedback" aria-live="polite">👽 慢慢找，沒關係！</p>${replayButton()}`);main.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{if(locked)return;if(b.dataset.word!==w.word){missed=true;events.push({type:'wrong',word:w.word});shake(b);ask();return}locked=true;complete(w,!missed)});document.querySelector('#replay').onclick=ask;ask()}
function shake(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
function fly(){events.push({type:'animation',animation:'star-flight'});const s=document.createElement('span');s.className='flight';s.textContent='⭐';document.body.append(s);setTimeout(()=>s.remove(),850)}
async function celebrate(messages,t){for(const m of messages){if(t!==token)return false;events.push({type:'animation',animation:'fireworks',kind:m.kind});effect(m.kind);const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=`<div class="firework">🎆 ${m.icon} 🎇</div><strong>${m.text}</strong>`;document.body.append(el);await speak(m.voice,'en-US');await delay(900);el.remove();if(t!==token)return false}return true}
async function complete(w,first,advance=true){silence();const t=token,p=P(),old=p.level;ledger[player][w.word]=[...attempts(player,w.word),{date:today(),firstTryCorrect:first}];p.stars++;p.questionsAnswered++;p.days[today()]=(p.days[today()]||0)+1;p.level=1+Math.floor(p.stars/10);const msgs=[];if(p.level>old)msgs.push({kind:'levelup',icon:'🚀',text:`升級！Lv${p.level}`,voice:'Level up!'});rewards.forEach((r,i)=>{if(p.stars>=r[2]&&!p.unlocked.includes(i)){p.unlocked.push(i);msgs.push({kind:'unlock',icon:r[0],text:`解鎖 ${r[1]}！`,voice:'New treasure unlocked!'})}});save();header();fly();effect('correct');events.push({type:'correct',player,mode,word:w.word,firstTry:first});const f=document.querySelector('#feedback');if(f)f.textContent='⭐ 太棒了！';await delay(450);if(t!==token)return;await celebrate(msgs,t);if(t!==token)return;if(advance)next();else locked=false}
function memory(first){const n=Math.min(6,P().level===1?3:P().level<4?4:P().level<7?5:6),words=[first,...Array.from({length:n-1},()=>pickWord(player))],cards=shuffle(words.flatMap(w=>[{word:w.word,type:'img'},{word:w.word,type:'word'}]));current={word:first.word,cards:cards.map(x=>({...x})),pairs:words.map(w=>w.word)};let opened=[],matched=new Set(),seen=new Set(),dirty=new Set();view('<h1>找出圖片和單字好朋友！</h1><p class="sub">翻一翻，聽一聽 · '+n+' 對</p><div class="memory">'+cards.map((c,i)=>`<button data-card="${c.word}:${c.type}" data-index="${i}" aria-label="翻開第 ${i+1} 張牌">🌟</button>`).join('')+'</div><p id="feedback">🤖 一起找找看！</p>'+replayButton());const buttons=[...main.querySelectorAll('[data-card]')];buttons.forEach((b,i)=>b.onclick=async()=>{if(locked||matched.has(cards[i].word)||opened.includes(i))return;effect('flip');const c=cards[i],w=D.words.find(w=>w.word===c.word);if(seen.has(i))dirty.add(c.word);seen.add(i);b.classList.add('open');b.innerHTML=c.type==='img'?`<img alt="${w.zh}" src="${w.image}">`:w.word;opened.push(i);silence();speak(w.word,'en-US',w.audio);if(opened.length<2)return;locked=true;const [a,z]=opened,t=token;if(cards[a].word===cards[z].word){matched.add(c.word);buttons[a].classList.add('matched');buttons[z].classList.add('matched');buttons[a].disabled=buttons[z].disabled=true;opened=[];effect('match');await complete(w,!dirty.has(c.word),false);if(mode!=='memory'||current?.cards!==cardsRef)return;if(matched.size===n){locked=true;const nt=token;await delay(700);if(nt===token)next()}}else{dirty.add(cards[a].word);dirty.add(cards[z].word);await delay(1100);if(t!==token)return;for(const j of opened){buttons[j].classList.remove('open');buttons[j].textContent='🌟'}opened=[];locked=false}});const cardsRef=current.cards;document.querySelector('#replay').onclick=()=>{if(!locked)speak('找出相同單字的圖片和文字！')};}
function spell(w){let index=0,errors=0;const letters=shuffle([...new Set(w.word)].map((letter,id)=>({letter,id})));current={word:w.word,target:w.word,nextLetter:w.word[0],next:w.word[0],letters};view(`<h1>🔤 幫單字排排隊！</h1><img class="target" data-word="${w.word}" alt="${w.zh}" src="${w.image}"><div class="slots" id="slots">${'_'.repeat(w.word.length)}</div><div class="row letters">${letters.map((x,i)=>`<button data-letter="${x.letter}" data-index="${i}">${x.letter}</button>`).join('')}</div><p id="feedback">聽一聽，從第一個字母開始！</p>${replayButton()}`);main.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{if(locked||b.disabled)return;if(b.dataset.letter!==w.word[index]){missed=true;errors++;shake(b);silence();speak(b.dataset.letter,'en-US');if(errors>=2)main.querySelectorAll('[data-letter]').forEach(x=>x.classList.toggle('hint',!x.disabled&&x.dataset.letter===w.word[index]));return}effect('tap');index++;b.disabled=!w.word.slice(index).includes(b.dataset.letter);b.classList.remove('hint');errors=0;current.nextLetter=current.next=w.word[index]||null;document.querySelector('#slots').textContent=w.word.slice(0,index)+'_'.repeat(w.word.length-index);main.querySelectorAll('.hint').forEach(x=>x.classList.remove('hint'));if(index===w.word.length){locked=true;complete(w,!missed)}});document.querySelector('#replay').onclick=ask;ask()}
async function repeat(w){const line=D.repeat.find(l=>l.episode_date===w.episode_date)||D.repeat[0];current.line=line.text;view(`<h1>🗣️ 跟我說</h1><img class="target" data-word="${w.word}" alt="${w.zh}" src="${w.image}"><div class="bubble">${line.text}</div><p>${line.zh}</p><div class="bubble" id="cue" aria-live="polite">👂 先聽聽</div>${replayButton()}`);document.querySelector('#replay').onclick=()=>{if(locked)return;silence();repeat(w)};const t=token;await speak(line.text,'en-US',line.audio);if(t!==token)return;document.querySelector('#cue').textContent='換你說！';await speak('換你說！');if(t!==token)return;for(const n of [3,2,1]){document.querySelector('#cue').textContent=n;events.push({type:'countdown',value:n});await delay(1000);if(t!==token)return}effect('applause');document.querySelector('#cue').textContent='👏 太棒了！';locked=true;complete(w,true)}
function progressPage(){reset();mode='progress';const p=P(),counts={學會了:0,練習中:0,該複習:0,記不住:0};D.words.forEach(w=>counts[status(attempts(player,w.word)).label]++);view(`<section data-testid="progress-page" style="width:100%"><h1>🏆 ${player} 的星際日記</h1><div class="stats"><p>⭐ ${p.stars} 星 · Lv${p.level}</p><p>已玩 ${p.questionsAnswered} 題</p><p>今天 ${p.days[today()]||0} 題</p><p>收藏 ${p.unlocked.length}/12</p></div><p>${modes.slice(0,5).map(m=>`${m[1]} ${m[2]} ${p.modes[m[0]]||0} 次`).join('　')}</p><div class="stats">${Object.entries(counts).map(([k,v])=>`<p>${k} ${v}</p>`).join('')}</div><button id="cabinet">🎁 打開收藏櫃</button><div class="list">${D.words.map(w=>`<div class="tile" data-word="${w.word}"><img alt="${w.zh}" src="${w.image}"><strong>${w.word}</strong><small>${status(attempts(player,w.word)).label}</small></div>`).join('')}</div></section>`,true);document.querySelector('#cabinet').onclick=collection}
function collection(){reset();mode='collection';view(`<section data-testid="collection" style="width:100%"><h1>🎁 星星收藏櫃</h1><p>⭐ ${P().stars} · 點選收藏，帶著它去冒險！</p><div class="list">${rewards.map((r,i)=>`<button class="tile" data-reward="${i}" ${P().unlocked.includes(i)?'':'disabled'}><span class="collect ${P().unlocked.includes(i)?'':'silhouette'}">${r[0]}</span><strong>${r[1]}</strong><small>${P().unlocked.includes(i)?P().equipped===i?'✓ 使用中':'點我套用':`🔒 ${r[2]} 星`}</small></button>`).join('')}</div></section>`,true);main.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>{P().equipped=Number(b.dataset.reward);save();collection();effect('tap')})}
document.querySelector('[data-testid="btn-home"]').onclick=home;document.querySelector('[data-testid="btn-switch"]').onclick=players;
const params=new URLSearchParams(location.search),from=params.get('from');if(from&&from!=='.'&&from!=='..'&&!/[\/\\\x00-\x1f]/.test(from)){const a=document.querySelector('#story');a.hidden=false;a.href='../'+encodeURIComponent(from)+'/index.html'}

if(names.includes(params.get('player'))){player=params.get('player');home()}else players();
